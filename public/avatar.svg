<svg width="400" height="400" viewBox="0 0 400 400" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="400" y2="400" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#050805" />
      <stop offset="50%" stop-color="#0a120a" />
      <stop offset="100%" stop-color="#020402" />
    </linearGradient>
    <linearGradient id="neonGlow" x1="0" y1="0" x2="400" y2="400" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#39FF14" />
      <stop offset="50%" stop-color="#00FF87" />
      <stop offset="100%" stop-color="#39FF14" />
    </linearGradient>
    <filter id="glowFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background Circle with Cyber Grid -->
  <circle cx="200" cy="200" r="185" fill="url(#bgGrad)" stroke="#39FF14" stroke-width="2" stroke-dasharray="6 4" opacity="0.6"/>
  <circle cx="200" cy="200" r="165" fill="#060906" stroke="url(#neonGlow)" stroke-width="2.5" filter="url(#glowFilter)"/>

  <!-- Subtle Geometric Grid Lines -->
  <path d="M70 200 H330 M200 70 V330" stroke="#39FF14" stroke-width="0.8" opacity="0.2"/>
  <circle cx="200" cy="200" r="110" stroke="#39FF14" stroke-width="0.8" stroke-dasharray="3 3" opacity="0.25"/>

  <!-- Stylized Tech Developer Silhouette / Monogram -->
  <circle cx="200" cy="145" r="50" fill="#0d180d" stroke="#39FF14" stroke-width="2.5"/>
  <!-- Headphones / HUD headset -->
  <path d="M140 145 C140 100 260 100 260 145" stroke="#39FF14" stroke-width="4" stroke-linecap="round" fill="none" opacity="0.8"/>
  <rect x="134" y="132" width="12" height="26" rx="6" fill="#39FF14"/>
  <rect x="254" y="132" width="12" height="26" rx="6" fill="#39FF14"/>

  <!-- Face Visor HUD Glow -->
  <path d="M165 145 H235" stroke="#39FF14" stroke-width="3" stroke-linecap="round" opacity="0.9"/>
  <circle cx="200" cy="145" r="3" fill="#39FF14"/>

  <!-- Torso & Shoulders -->
  <path d="M110 300 C110 230 150 215 200 215 C250 215 290 230 290 300" fill="#0d180d" stroke="#39FF14" stroke-width="2.5"/>
  <path d="M160 218 L200 255 L240 218" stroke="#39FF14" stroke-width="1.8" fill="none" opacity="0.7"/>

  <!-- Code Bracket Accents -->
  <text x="75" y="170" fill="#39FF14" font-family="monospace" font-size="28" font-weight="bold" opacity="0.75">&lt;</text>
  <text x="305" y="170" fill="#39FF14" font-family="monospace" font-size="28" font-weight="bold" opacity="0.75">&gt;</text>
  <text x="65" y="240" fill="#39FF14" font-family="monospace" font-size="20" opacity="0.5">01</text>
  <text x="310" y="240" fill="#39FF14" font-family="monospace" font-size="20" opacity="0.5">10</text>

  <!-- Developer Monogram Badge -->
  <rect x="160" y="315" width="80" height="26" rx="13" fill="#030503" stroke="#39FF14" stroke-width="1.5"/>
  <text x="200" y="333" fill="#39FF14" font-family="monospace" font-size="12" font-weight="bold" text-anchor="middle" letter-spacing="2">SRINIWAS</text>
</svg>