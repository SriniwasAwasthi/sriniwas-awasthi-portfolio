  <text x="145" y="299" fill="#39FF14" font-family="monospace" font-size="9" text-anchor="middle" font-weight="bold">ADD TO TASTING CART</text>

  <rect x="260" y="115" width="210" height="200" rx="8" fill="#111a11" stroke="#39FF14" stroke-width="0.8" stroke-opacity="0.3"/>
  <text x="275" y="140" fill="#39FF14" font-family="monospace" font-size="11" font-weight="bold">MULTI-CURRENCY STORE ENGINE</text>
  <text x="275" y="165" fill="#889988" font-family="monospace" font-size="10">• Memoized cart re-computation</text>
  <text x="275" y="185" fill="#889988" font-family="monospace" font-size="10">• Real-time FX exchange rate cache</text>
  <text x="275" y="205" fill="#889988" font-family="monospace" font-size="10">• React 19 Concurrent Mode</text>
  <text x="275" y="225" fill="#889988" font-family="monospace" font-size="10">• Tailwind CSS v4 tokenized styling</text>
  <text x="275" y="255" fill="#ffffff" font-family="monospace" font-size="11">Active Currency: <tspan fill="#39FF14">USD ($)</tspan></text>
  <text x="275" y="275" fill="#ffffff" font-family="monospace" font-size="11">Subtotal Latency: <tspan fill="#39FF14">&lt;8ms</tspan></text>

  <!-- Right: Web Audio API Graph Visualizer -->
  <rect x="510" y="60" width="260" height="360" rx="10" fill="#0a100a" stroke="#39FF14" stroke-width="1" stroke-opacity="0.25"/>
  <text x="525" y="90" fill="#39FF14" font-family="monospace" font-size="11" font-weight="bold">WEB AUDIO NODE GRAPH</text>

  <!-- Audio Nodes Diagram -->
  <rect x="530" y="115" width="220" height="40" rx="6" fill="#142214" stroke="#39FF14" stroke-width="1"/>
