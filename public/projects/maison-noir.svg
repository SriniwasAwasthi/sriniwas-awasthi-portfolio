  <line x1="640" y1="155" x2="640" y2="185" stroke="#39FF14" stroke-width="2" stroke-dasharray="3 3"/>

  <rect x="530" y="185" width="220" height="40" rx="6" fill="#142214" stroke="#39FF14" stroke-width="1"/>
  <text x="640" y="210" fill="#ffffff" font-family="monospace" font-size="11" text-anchor="middle">BiquadFilterNode [Lowpass]</text>

  <line x1="640" y1="225" x2="640" y2="255" stroke="#39FF14" stroke-width="2" stroke-dasharray="3 3"/>

  <rect x="530" y="255" width="220" height="40" rx="6" fill="#142214" stroke="#39FF14" stroke-width="1"/>
  <text x="640" y="280" fill="#ffffff" font-family="monospace" font-size="11" text-anchor="middle">GainNode [Master Fader]</text>

  <line x1="640" y1="295" x2="640" y2="325" stroke="#39FF14" stroke-width="2"/>

  <rect x="530" y="325" width="220" height="40" rx="6" fill="#060906" stroke="#39FF14" stroke-width="1.5"/>
  <text x="640" y="350" fill="#39FF14" font-family="monospace" font-size="11" font-weight="bold" text-anchor="middle">AudioDestination (Speakers)</text>

  <text x="525" y="395" fill="#39FF14" font-family="monospace" font-size="10">SYNTHESIS: 60 FPS WITHOUT JANK</text>
